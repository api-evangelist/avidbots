description: Avidbots is a robotics company that designs and manufactures fully autonomous
  commercial floor-cleaning robots, including the Neo, Neo 2W, and Kas scrubbers, powered
  by its proprietary Avidbots Autonomy AI, lidar, and 3D sensing for real-time mapping,
  dynamic route planning, and intervention-free cleaning. Its robots serve airports,
  warehouses, retail, manufacturing, education, and healthcare facilities, and are
  managed through the web-based Avidbots Command Center. Avidbots was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network; no public
  developer API, OpenAPI, or developer portal was found during enrichment.
